# design.md §14: the core building clean under -Wall -Wextra -Werror on
# both toolchains is the mechanism that keeps SDK dependencies from
# leaking down into src/core/. CI is where that is enforced.
name: ci

on:
  push:
  pull_request:

jobs:
  host:
    name: host core + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the 6502 test suites
        run: ./tools/fetch-test-suites.sh test/suites

      - name: Configure
        run: cmake -S . -B build/host -DPICO_ATOM_HOST=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/host -j

      - name: Test
        env:
          PICO_ATOM_TEST_ROMS: ${{ github.workspace }}/test/suites
        run: ctest --test-dir build/host --output-on-failure --no-tests=error

  firmware:
    name: pico2 UF2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Arm toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.2.Rel1'

      - name: Fetch the Pico SDK
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.3.1
          path: pico-sdk
          submodules: true

      - name: Configure
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: cmake -S . -B build/pico -DPICO_BOARD=pico2 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: cmake --build build/pico -j

      # §18: SRAM growth past the §5 budget should fail loudly and early,
      # not as a heap that dies at runtime.
      - name: Report SRAM use
        run: arm-none-eabi-size build/pico/pico-atom.elf

      - uses: actions/upload-artifact@v4
        with:
          name: pico-atom-uf2
          path: build/pico/pico-atom.uf2
